project:
  name: Codex Travel Agent Local
  default_trip_id: dolomites-2026
  locale: he-IL
  user_timezone: Asia/Jerusalem

storage:
  database_path: data/travel-agent.sqlite
  backup_directory: data/backups
  export_directory: data/exports

dashboard:
  host: 127.0.0.1
  port: 4177

maps:
  provider: google_maps_grounding_lite
  remote_mcp_url: https://mapstools.googleapis.com/mcp
  search_tools:
    - search_places
    - compute_routes
    - lookup_weather
  saved_lists_write_provider: chrome
  attribution_required: true
  store_google_content_policy:
    store_place_ids: true
    store_user_exported_content: true
    cache_grounding_response_bodies: false

calendar:
  provider: local_google_calendar_connector
  policy_path: .agents/skills/travel-planner/references/calendar-policy.md
  calendar_name: "חו״ל"
  calendar_id: "00da743e003f133d4e2a97203388349337c0584d04ef6bb372d0d6080877f18d@group.calendar.google.com"
  write_method: google_calendar_api
  fallback_write_method: apps_script_advanced_calendar_service
  forbid_rich_text_editor_writes: true
  update_existing_events_in_place: true
  send_updates_default: none
  attendee_removal_authorized: true
  itinerary_attendee_exclusions:
    - davidfr97@gmail.com
  require_raw_post_write_verification: true
  require_post_delete_absence_verification: true
  trip_timezone: Europe/Rome
  dry_run_default: true
  require_confirmation_for_write: true
  require_confirmation_for_delete: true
  oauth_client_path: secrets/google-oauth-client.json
  oauth_token_path: secrets/google-oauth-token.json
  protected_events:
    - title_contains: "LY 289"
      date: "2026-09-09"
    - title_contains: "LY 290"
      date: "2026-09-25"
  lodging_sync:
    source_of_truth: airbnb_confirmation_email
    mailbox_account: david04031997@gmail.com
    prefer_provider_created_calendar_event: true
    allow_provider_created_event_in_place_updates: true
    provider_event_updates_only_in_configured_calendar: true
    provider_event_update_mode: add_missing_relevant_details
    provider_event_deletion_allowed: false
    suppress_proactive_lodging_event_creation: true
    require_inbox_and_calendar_duplicate_check_before_manual_write: true
    manual_write_requires_explicit_user_request: true
    duplicate_match_fields:
      - provider
      - reservation_or_listing
      - check_in
      - check_out

browser:
  primary: codex_chrome_extension
  fallback: chrome_devtools_mcp
  dedicated_profile: true
  profile_account_email: david04031997@gmail.com
  full_site_access_on_allowlist: true
  allowed_domains:
    - maps.google.com
    - google.com
    - mail.google.com
    - airbnb.com
    - booking.com
    - dolomiti.org
    - suedtirol.info
    - cortina.dolomiti.org
    - seceda.it
    - alpedisiusi.bz.it
  blocked_actions:
    - reveal_saved_passwords
    - export_payment_card_numbers
    - copy_auth_cookies_to_files
  confirmation_required_actions:
    - final_purchase
    - final_booking
    - send_message_to_host
    - cancel_booking
    - delete_calendar_event

lodging:
  providers:
    - airbnb_chrome
    - booking_plugin_or_chrome
  default_adults: 2
  price_currency: ILS
  price_basis: all_in_per_room_per_night
  budgets_ils_per_room_night:
    simple:
      target: 250
      maximum: 350
    standard:
      target_minimum: 250
      target_maximum: 500
      maximum: 550
    pamper:
      target_minimum: 500
      maximum: 800
      nights_per_trip_minimum: 1
      nights_per_trip_maximum: 2
    absolute_maximum: 800
  hard_requirements:
    towels_included: true
    linens_included: true
    private_bathroom: true
    cleanliness_verified: true
    all_fees_known: true
    parking_verified_when_car_active: true
    cancellation_terms_verified: true
    full_refund_until_24_hours_before_check_in: true
    full_refund_includes_all_prepaid_lodging_fees: true
    refund_to_original_payment_method: true
  parking:
    preferred: free_on_premises
    add_paid_parking_to_all_in_price: true
    reject_unknown_when_car_active: true
  spa:
    preferred: private_in_unit
    allow_shared: true
    require_availability_details: true
    require_extra_cost_details: true
    include_extra_cost_in_all_in_price: true
  cancellation:
    required_for_shortlist: true
    maximum_hours_before_check_in_for_full_refund: 24
    refund_scope: all_prepaid_lodging_charges_including_cleaning_and_service_fees
    refund_method: original_payment_method
    reject_partial_refund: true
    reject_travel_credit_only: true
    reject_unknown_terms: true
    reverify_at_checkout_before_booking: true
  rating_preferences:
    airbnb_minimum: 4.7
    booking_minimum: 8.5
  historical_price_profile:
    source: airbnb_completed_stays_review
    reviewed_at: "2026-07-25"
    priced_stays: 29
    median_ils_per_night: 342.25
    maximum_ils_per_night: 694.14
    spa_reference_ils_per_night: 672.86
  ranking_weights:
    route_fit: 0.15
    total_price: 0.35
    rating: 0.10
    parking: 0.15
    cancellation: 0.05
    preference_fit: 0.20

audit:
  log_reads: false
  log_writes: true
  log_external_actions: true
  redact_secrets: true
